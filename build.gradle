plugins {
    id 'java'
    id 'idea'
    id 'com.gradleup.shadow' version '9.3.1'
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://central.sonatype.com/repository/maven-snapshots') }
    maven { url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/') }
    maven { url = uri('https://repo.codemc.io/repository/nms/') }
    maven { url = uri('https://jitpack.io') }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from(sourceSets.main.resources.srcDirs) {
        include '*.yml'
        expand(rootProject.properties)
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.11-R0.1-SNAPSHOT'

    // Library loader
    implementation 'com.saicone.ezlib:ezlib:1.3.2'
    implementation 'com.saicone.ezlib:loader:1.3.2'
    compileOnly 'com.saicone.ezlib:annotations:1.3.2'
    annotationProcessor 'com.saicone.ezlib:annotations:1.3.2'

    // Implementation
    compileOnly 'com.saicone.settings:settings:1.0.5'
    compileOnly 'com.saicone.settings:settings-yaml:1.0.5'
    compileOnly 'com.saicone.delivery4j:delivery4j:1.1.5'
    compileOnly 'com.saicone.delivery4j:broker-sql-hikari:1.1.5'
    compileOnly 'com.saicone.delivery4j:broker-redis:1.1.5'
    compileOnly 'at.favre.lib:bcrypt:0.9.0'
    implementation 'org.bstats:bstats-bukkit:2.2.1'
    compileOnly 'com.github.zafarkhaja:java-semver:0.9.0'

    compileOnly 'org.jetbrains:annotations:26.0.2'

    compileOnly fileTree(dir: 'libs', includes: ['*.jar'])
}

compileJava {
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

jar {
    enabled = false
    dependsOn (shadowJar)
}

shadowJar {
    archiveClassifier.set('')
    relocate 'com.saicone.ezlib', project.group + '.ezlib'
    relocate 'com.saicone.settings', project.group + '.libs.settings'
    relocate 'com.saicone.types', project.group + '.libs.types'
    relocate 'org.yaml.snakeyaml', project.group + '.libs.snakeyaml'
    relocate 'com.saicone.delivery4j', project.group + '.libs.delivery4j'
    relocate 'com.zaxxer.hikari', project.group + '.libs.hikari'
    relocate 'redis.clients.jedis', project.group + '.libs.jedis'
    relocate 'at.favre.lib.crypto.bcrypt', project.group + '.libs.bcrypt'
    relocate 'at.favre.lib.bytes', project.group + '.libs.bytes'
    relocate 'com.github.zafarkhaja.semver', project.group + '.libs.semver'
    relocate 'org.bstats', project.group + '.libs.bstats'
    minimize()
}